// App Android nativa: l'interfaccia Ferrite (cartella web/) in una WebView,
// collegata ai comandi multimediali di Android. Nessuna libreria esterna.
plugins { id 'com.android.application' }

android {
    namespace 'it.ferrite.player'
    compileSdk 34

    defaultConfig {
        applicationId 'it.ferrite.player'
        minSdk 23
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName '2.0'
    }

    sourceSets {
        main {
            // index.html, icone e manifest arrivano direttamente da web/ (generata da build-web.sh)
            assets.srcDirs = ['src/main/assets', '../../web']
        }
    }

    signingConfigs {
        release {
            storeFile file('../ferrite.keystore')
            storePassword System.getenv('FERRITE_KS_PASS')
            keyAlias 'ferrite'
            keyPassword System.getenv('FERRITE_KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
