// App Android "Trusted Web Activity": apre il sito Ferrite pubblicato a schermo intero, usando Chrome.
// L'indirizzo del sito arriva da -PsiteUrl=https://tuosito.netlify.app (lo passa il workflow).
plugins { id 'com.android.application' }

def siteUrl = (project.findProperty('siteUrl') ?: 'https://example.netlify.app').toString().replaceAll('/+$', '') + '/'
def siteHost = new URI(siteUrl).host.toLowerCase()

android {
    namespace 'it.ferrite.player'
    compileSdk 34

    defaultConfig {
        applicationId 'it.ferrite.player'
        minSdk 21
        targetSdk 34
        versionCode((project.findProperty('versionCode') ?: '1').toString().toInteger())
        versionName '1.0'
        manifestPlaceholders = [hostName: siteHost, defaultUrl: siteUrl]
        resValue 'string', 'app_name', 'Ferrite'
        resValue 'string', 'assetStatements',
            '[{ \\"relation\\": [\\"delegate_permission/common.handle_all_urls\\"], \\"target\\": {\\"namespace\\": \\"web\\", \\"site\\": \\"https://' + siteHost + '\\"}}]'
    }

    signingConfigs {
        release {
            storeFile file('../ferrite.keystore')
            storePassword System.getenv('FERRITE_KS_PASS')
            keyAlias 'ferrite'
            keyPassword System.getenv('FERRITE_KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
